<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b12">
  <title>{% block title %}Nmap Guardian{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}" aria-label="Nmap Guardian home">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span>Nmap Guardian</span>
    </a>
    <nav aria-label="Primary navigation">
      <a href="{{ url_for('index') }}" {% if request.endpoint == 'index' %}aria-current="page"{% endif %}>Overview</a>
      <a href="{{ url_for('guidance') }}" {% if request.endpoint == 'guidance' %}aria-current="page"{% endif %}>Playbook</a>
      <span class="scope"><i class="scope-pulse" aria-hidden="true"></i> Localhost only</span>
    </nav>
  </header>
  <main id="main-content" class="page">{% block content %}{% endblock %}</main>
  <section id="scan-progress" class="scan-progress" hidden role="status" aria-live="polite" aria-atomic="true">
    <div class="scan-progress-head"><span>Estimated scan progress</span><strong data-scan-progress-value>0%</strong></div>
    <div class="scan-progress-track" role="progressbar" aria-label="Estimated local scan progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span data-scan-progress-fill></span></div>
    <p data-scan-progress-message>Preparing the local scanner…</p>
  </section>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js" defer></script>
  <script type="module" src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
